plugins {
    id 'com.android.library'
    id 'kotlin-android'
}

android {
    defaultConfig {
        minSdkVersion 23
        targetSdk 33
        compileSdk 35
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    namespace 'com.stupidtree.hita.api'
}

// 插件契约模块：只允许依赖 Kotlin 标准库，禁止引入 AndroidX 之外的运行时。
// 所有插件都编译在此 ABI 上，这里的任何破坏性改动都要同步 HITA_API_VERSION。
dependencies {
    testImplementation 'junit:junit:4.13.2'
    api "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    api project(':model')
    api project(':component')
    api 'androidx.lifecycle:lifecycle-livedata-core:2.8.4'
    // SearchTab 的契约里出现 Fragment，插件侧需要同一份类型。
    api 'androidx.fragment:fragment:1.6.2'
    // SyncCodec 的契约里出现 JsonObject。
    api 'com.google.code.gson:gson:2.8.9'
}
