plugins {
    id 'com.android.library'
    id 'kotlin-android'
}

android {
    defaultConfig {
        minSdkVersion 23
        targetSdk 33
        compileSdk 35
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    namespace 'com.stupidtree.hita.api'
}

// 插件契约模块：只允许依赖 Kotlin 标准库，禁止引入 AndroidX 之外的运行时。
// 所有插件都编译在此 ABI 上，这里的任何破坏性改动都要同步 HITA_API_VERSION。
dependencies {
    testImplementation 'junit:junit:4.13.2'
    api "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    api project(':model')
    api project(':component')
    api 'androidx.lifecycle:lifecycle-livedata-core:2.8.4'
    // SearchTab 的契约里出现 Fragment，插件侧需要同一份类型。
    api 'androidx.fragment:fragment:1.6.2'
    // SyncCodec 的契约里出现 JsonObject。
    api 'com.google.code.gson:gson:2.8.9'
}

// 生成 :api 的公开 ABI 指纹。插件发布时把该值写入索引的 apiAbi 字段，
// 宿主启动时与 BuildConfig.API_ABI 比对，捕获“版本号没变但签名变了”的破坏性变更。
tasks.register('generateApiAbi') {
    group = 'verification'
    description = 'Generate api-abi.txt from the public :api contract.'
    dependsOn 'bundleLibCompileToJarDebug'
    doLast {
        def jar = fileTree("$buildDir/intermediates") { include '**/classes.jar' }.files.find { candidate ->
            try {
                new java.util.zip.ZipFile(candidate).withCloseable {
                    it.getEntry('com/stupidtree/hita/api/Plugin.class') != null
                }
            } catch (ignored) {
                false
            }
        }
        if (jar == null) throw new GradleException('未找到包含 :api 契约的 classes.jar')
        def classes = []
        new java.util.zip.ZipFile(jar).withCloseable { zip ->
            zip.entries().each { entry ->
                if (entry.name.endsWith('.class') && !entry.name.contains('$')) {
                    classes << entry.name.substring(0, entry.name.length() - 6).replace('/', '.')
                }
            }
        }
        def javapCandidates = []
        javapCandidates << new File(System.getProperty('java.home'), 'bin/javap')
        def envJavaHome = System.getenv('JAVA_HOME')
        if (envJavaHome) javapCandidates << new File(envJavaHome, 'bin/javap')
        def studioJbr = System.getenv('ANDROID_STUDIO_JBR')
        if (studioJbr) javapCandidates << new File(studioJbr, 'bin/javap')
        def userJdks = new File(System.getProperty('user.home'), '.jdks')
        if (userJdks.isDirectory()) {
            userJdks.listFiles()?.each { jdk -> javapCandidates << new File(jdk, 'bin/javap') }
        }
        javapCandidates << new File(System.getProperty('user.home'), 'android-studio/jbr/bin/javap')
        def javap = javapCandidates.find { it.isFile() }
        if (javap == null) throw new GradleException('找不到 javap；请安装完整 JDK 或设置 JAVA_HOME')
        def signatures = classes.sort().collect { name ->
            def process = new ProcessBuilder(
                javap.absolutePath, '-classpath', jar.absolutePath, '-public', name,
            ).redirectErrorStream(true).start()
            process.inputStream.text.trim()
        }.join('\n')
        def digest = java.security.MessageDigest.getInstance('SHA-256')
            .digest(signatures.getBytes('UTF-8'))
            .encodeHex().toString()
        file('api-abi.txt').text =
            "# generated by :api:generateApiAbi; do not edit\n" +
            "# classes: ${classes.size()}\n" +
            "${digest}\n"
        println "api abi: ${digest} (${classes.size()} classes)"
    }
}

// 防止提交的 ABI 指纹落后于 :api 公开签名；CI/本地可运行 :verifyApiAbi。
tasks.register('verifyApiAbi') {
    group = 'verification'
    description = 'Regenerate api-abi.txt and fail if the committed fingerprint is stale.'
    dependsOn 'generateApiAbi'
    doLast {
        def process = new ProcessBuilder(
            'git', 'diff', '--exit-code', '--', 'api/api-abi.txt',
        ).directory(rootProject.projectDir).inheritIO().start()
        if (process.waitFor() != 0) {
            throw new GradleException('api/api-abi.txt 已过期，请提交重新生成的指纹')
        }
    }
}
