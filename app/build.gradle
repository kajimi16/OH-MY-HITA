plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
}

// CI 通过 -PappVersionName / -PappVersionCode 覆盖。
// 本地默认 versionCode 取当前时间戳（秒），保证本地包能覆盖 CI 包、CI 包也能覆盖本地包。
def appVersionCodeValue = (project.findProperty("appVersionCode") ?: System.currentTimeMillis().intdiv(1000L)).toInteger()
def appVersionNameValue = (project.findProperty("appVersionName") ?: "0.0.1") as String
// 插件市场索引地址；留空时读应用私有目录（仅 debug 有内置演示）
def pluginIndexUrl = (project.findProperty("pluginIndexUrl") ?: "") as String
// 使用统计/插件人数后端；换成自己的 Worker 域名即可，路径固定 /api/usage、/api/market/stats。
def usageBaseUrl = (project.findProperty("usageBaseUrl") ?: "https://api.hita.limpu.cn") as String
// 由 :api:generateApiAbi 生成；发布插件时把同一个哈希写进索引的 apiAbi。
def apiAbiFile = rootProject.file("api/api-abi.txt")
def apiAbiValue = apiAbiFile.exists()
        ? (apiAbiFile.readLines().find { it.trim() && !it.startsWith("#") } ?: "")
        : ""

// 发布签名优先读取用户目录下的私有属性文件；CI 仍可写入 local.properties。
// 缺失时打未签名包。
def keystoreProps = new Properties()
def externalKeystoreProps = new File(System.getProperty("user.home"), ".oh-my-hita/release.properties")
if (externalKeystoreProps.exists()) {
    externalKeystoreProps.withInputStream { keystoreProps.load(it) }
}
def keystorePropsFile = rootProject.file("local.properties")
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def hasReleaseKeystore = keystoreProps.getProperty("RELEASE_KEYSTORE") != null


android {

//    buildToolsVersion '31.0.0-rc5'

    defaultConfig {
        // 与原版 HITA 不同的包名，二者可共存安装。
        applicationId "io.github.kajimi16.ohmyhita"
        minSdkVersion 23
        targetSdk 33
        compileSdk 35
        versionCode appVersionCodeValue
        versionName appVersionNameValue

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "UPDATE_URL", '"https://github.com/kajimi16/OH-MY-HITA/releases/latest"'
        buildConfigField "String", "UPDATE_VERSION_NAME", "\"${appVersionNameValue}\""
        buildConfigField "long", "UPDATE_VERSION_CODE", "${appVersionCodeValue}L"
        buildConfigField "String", "UPDATE_LOG", '""'
        buildConfigField "boolean", "UPDATE_ALLOW_PRERELEASE", "true"
        // 插件市场索引地址；为空时读 filesDir/market/index.json（本地联调）
        buildConfigField "String", "COMPOSE_RUNTIME_VERSION", "\"${compose_version}\""
        buildConfigField "String", "PLUGIN_INDEX_URL", "\"${pluginIndexUrl}\""
        buildConfigField "String", "USAGE_BASE_URL", "\"${usageBaseUrl}\""
        buildConfigField "String", "API_ABI", "\"${apiAbiValue}\""
    }
//    viewBinding{
//        enabled = true
//    }
    buildFeatures {
        //dataBinding = true
        // for view binding :
        buildConfig = true
        viewBinding = true
        compose = true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }

    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                storeFile file(keystoreProps.getProperty("RELEASE_KEYSTORE"))
                storePassword keystoreProps.getProperty("RELEASE_KEYSTORE_PASSWORD")
                keyAlias keystoreProps.getProperty("RELEASE_KEY_ALIAS")
                keyPassword keystoreProps.getProperty("RELEASE_KEY_PASSWORD")
            }
        }
    }

    lint {
        // 存量问题固定下来；新增问题仍然会让 CI 失败。
        baseline = file("lint-baseline.xml")
        abortOnError true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
//        useIR = true
    }
    namespace 'com.stupidtree.hitax'

}

