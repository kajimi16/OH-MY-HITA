// Compatibility alias for tooling/scripts that still invoke :app:testClasses (Java plugin task).
tasks.register('testClasses') {
    group = 'verification'
    description = 'Compatibility task alias for legacy invocations; runs debug unit tests.'
    dependsOn 'testDebugUnitTest'
}

// 宿主不得直接依赖插件的仓库 / DAO / 数据库实现——只能通过 :api 的服务契约访问。
// 同时检查插件模块自身的依赖 allowlist：禁止 :app 和插件间依赖。
tasks.register('verifyPluginBoundary') {
    def forbidden = [
            'com.stupidtree.hitax.data.repository.TimetableRepository',
            'com.stupidtree.hitax.data.repository.SubjectRepository',
            'com.stupidtree.hitax.data.repository.IcsImport',
            'com.stupidtree.hitax.data.source.dao.'
    ]
    def sharedModules = [':api', ':model', ':component', ':style', ':user', ':sync']
    def pluginAllow = [
            'plugin-hita'    : [':api', ':model', ':style', ':component', ':user', ':sync'],
            'plugin-eas'     : [':api', ':model', ':component', ':style', ':user', ':sync'],
            'plugin-resource': [':api', ':model', ':component', ':style'],
            'plugin-user'    : [':api', ':model', ':user', ':component', ':style', ':sync'],
            'theta'          : [':api', ':style', ':component', ':user'],
    ]
    doLast {
        def offenders = []
        fileTree('src/main/java').matching { include '**/*.kt' }.each { f ->
            def text = f.text
            forbidden.each { token ->
                if (text.contains(token)) offenders << "${f.path}: $token"
            }
        }

        def moduleNames = rootProject.file('.').listFiles()
                ?.findAll { it.isDirectory() && (it.name.startsWith('plugin-') || it.name == 'theta') }
                ?.collect { it.name } ?: []
        moduleNames.each { module ->
            def build = rootProject.file("${module}/build.gradle")
            if (!build.isFile()) return
            def allowed = module.startsWith('plugin-ui-')
                    ? [':api']
                    : (pluginAllow[module] ?: sharedModules)
            def matcher = build.text =~ /project\s*\(\s*(?:path\s*:\s*)?['"](:[A-Za-z0-9_-]+)['"]\s*\)/
            matcher.each { match ->
                def dep = match[1]
                if (dep == ':app' || dep.startsWith(':plugin-') || !allowed.contains(dep)) {
                    offenders << "${module}/build.gradle: unsupported dependency $dep"
                }
            }
        }

        if (!offenders.isEmpty()) {
            throw new GradleException("插件依赖越界：\n" + offenders.join("\n"))
        }
    }
}

// 市场索引的基本契约校验：唯一 id、sha256、API 范围、preset 引用存在。
tasks.register('verifyMarketIndex') {
    group = 'verification'
    def indexFile = rootProject.file('market/index.json')
    def pluginApi = rootProject.file('api/src/main/java/com/stupidtree/hita/api/Plugin.kt')
    doLast {
        if (!indexFile.isFile()) throw new GradleException("market/index.json 不存在")
        def hostApi = 0
        def apiMatcher = pluginApi.text =~ /HITA_API_VERSION\s*=\s*(\d+)/
        if (apiMatcher.find()) hostApi = apiMatcher.group(1).toInteger()
        if (hostApi <= 0) throw new GradleException("无法从 Plugin.kt 解析 HITA_API_VERSION")

        def json = new groovy.json.JsonSlurper().parse(indexFile)
        def errors = []
        def seen = [] as Set
        def plugins = json.plugins ?: []
        def uiPlugins = json.uiPlugins ?: []

        def validateArtifact = { String kind, plugin ->
            if (!plugin.id) errors << "${kind}: 条目缺少 id"
            def key = "${kind}:${plugin.id}".toString()
            if (plugin.id && !seen.add(key)) errors << "重复 ${kind} id: ${plugin.id}"
            if (!plugin.name) errors << "${kind}:${plugin.id}: 缺少 name"
            if (!(plugin.sha256 ==~ /[0-9a-fA-F]{64}/)) {
                errors << "${kind}:${plugin.id}: sha256 不是 64 位十六进制"
            }
            if (!plugin.url) errors << "${kind}:${plugin.id}: 缺少 url"
            def minApi = plugin.minHostApi
            if (minApi != null && minApi > hostApi) {
                errors << "${kind}:${plugin.id}: minHostApi ${minApi} > host ${hostApi}"
            }
            def maxApi = plugin.maxHostApi
            if (maxApi != null && minApi != null && maxApi < minApi) {
                errors << "${kind}:${plugin.id}: maxHostApi ${maxApi} < minHostApi ${minApi}"
            }
            if (plugin.apiVersion != null && plugin.apiVersion > hostApi) {
                errors << "${kind}:${plugin.id}: apiVersion ${plugin.apiVersion} > host ${hostApi}"
            }
        }
        plugins.each { validateArtifact('dex', it) }
        uiPlugins.each { validateArtifact('ui', it) }

        def builtinFile = rootProject.file('app/src/main/assets/plugins.json')
        if (!builtinFile.isFile()) throw new GradleException("app/src/main/assets/plugins.json 不存在")
        // 已知服务名只来自 :api 的 ServiceKey 声明；内置插件清单里的 requires/provides
        // 必须使用其中一个，否则是拼写错误或引用了插件私有/已删除的服务。
        def knownServices = new TreeSet<String>()
        def apiDir = rootProject.file('api/src/main/java/com/stupidtree/hita/api')
        if (!apiDir.isDirectory()) throw new GradleException("api 源码目录不存在：${apiDir}")
        rootProject.fileTree(apiDir).matching { include '**/*.kt' }.each { apiFile ->
            def serviceMatcher = apiFile.text =~ /ServiceKey<[^>]+>\s*\(\s*"([^"]+)"\s*\)/
            while (serviceMatcher.find()) knownServices.add(serviceMatcher.group(1))
        }
        if (knownServices.isEmpty()) {
            throw new GradleException("无法从 :api 源码解析任何 ServiceKey.name")
        }
        def builtinJson = new groovy.json.JsonSlurper().parse(builtinFile)
        (builtinJson.plugins ?: []).each { entry ->
            if (!entry.id) {
                errors << "builtin: 条目缺少 id"
            } else if (!seen.add("builtin:${entry.id}".toString())) {
                errors << "重复 builtin id: ${entry.id}"
            }
            if (!entry.class) errors << "builtin:${entry.id}: 缺少 class"
            ['requires', 'provides'].each { field ->
                (entry[field] ?: []).each { service ->
                    if (!(service in knownServices)) {
                        errors << "builtin:${entry.id}: ${field} 引用了 :api 中不存在的服务 '${service}'"
                    }
                }
            }
        }

        def known = seen as Set
        (json.presets ?: []).each { preset ->
            (preset.plugins ?: []).each { ref ->
                if (!ref.id) {
                    errors << "preset ${preset.id}: 空引用"
                    return
                }
                def kind = (ref.kind ?: 'ui').toString().toLowerCase()
                if (!(kind in ['ui', 'dex', 'builtin'])) {
                    errors << "preset ${preset.id}: 未知 kind ${ref.kind}"
                } else if (!known.contains("${kind}:${ref.id}".toString())) {
                    errors << "preset ${preset.id}: 引用不存在的 ${kind}:${ref.id}"
                }
            }
        }

        if (!errors.isEmpty()) {
            throw new GradleException("market/index.json 校验失败：\n" + errors.join("\n"))
        }
    }
}

tasks.matching { it.name == 'preBuild' }.configureEach {
    dependsOn 'verifyPluginBoundary', 'verifyMarketIndex'
}
