plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
}

// CI 通过 -PappVersionName / -PappVersionCode 覆盖。
// 本地默认 versionCode 取当前时间戳（秒），保证本地包能覆盖 CI 包、CI 包也能覆盖本地包。
def appVersionCodeValue = (project.findProperty("appVersionCode") ?: (System.currentTimeMillis() / 1000L)).toString().toInteger()
def appVersionNameValue = (project.findProperty("appVersionName") ?: "0.0.1") as String

// 发布签名从 local.properties 读取（该文件已被 .gitignore 排除）；缺失时打未签名包。
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file("local.properties")
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def hasReleaseKeystore = keystoreProps.getProperty("RELEASE_KEYSTORE") != null


android {

//    buildToolsVersion '31.0.0-rc5'

    defaultConfig {
        // 与原版 HITA 不同的包名，二者可共存安装。
        applicationId "io.github.kajimi16.ohmyhita"
        minSdkVersion 23
        targetSdk 33
        compileSdk 35
        versionCode appVersionCodeValue
        versionName appVersionNameValue

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation":
                                     "$projectDir/schemas".toString()]
            }
        }

        buildConfigField "String", "HOA_BASE_URL", '"http://47.115.160.70:8081"'
        buildConfigField "String", "HOA_API_KEY", '""'
        buildConfigField "String", "UPDATE_URL", '"https://github.com/kajimi16/OH-MY-HITA/releases/latest"'
        buildConfigField "String", "UPDATE_VERSION_NAME", "\"${appVersionNameValue}\""
        buildConfigField "long", "UPDATE_VERSION_CODE", "${appVersionCodeValue}L"
        buildConfigField "String", "UPDATE_LOG", '""'
        buildConfigField "boolean", "UPDATE_ALLOW_PRERELEASE", "true"
    }
//    viewBinding{
//        enabled = true
//    }
    buildFeatures {
        //dataBinding = true
        // for view binding :
        buildConfig = true
        viewBinding = true
        compose = false
        composeOptions {
            kotlinCompilerVersion '1.4.30'
            kotlinCompilerExtensionVersion compose_version
        }
    }

    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                storeFile file(keystoreProps.getProperty("RELEASE_KEYSTORE"))
                storePassword keystoreProps.getProperty("RELEASE_KEYSTORE_PASSWORD")
                keyAlias keystoreProps.getProperty("RELEASE_KEY_ALIAS")
                keyPassword keystoreProps.getProperty("RELEASE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
//        useIR = true
    }
    namespace 'com.stupidtree.hitax'

}

dependencies {

    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.viewpager:viewpager:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation project(path: ':api')
    implementation project(path: ':component')
    implementation project(path: ':user')
    implementation project(path: ':sync')
    implementation project(path: ':style')
    implementation project(path: ':theta')
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'


    implementation "androidx.room:room-runtime:2.6.1"
    kapt "androidx.room:room-compiler:2.6.1"


    //kotlin的viewModel
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.4"
    //Glide图片加载
    implementation 'com.github.bumptech.glide:glide:4.16.0'
//retrofit2的gson转换器
    implementation 'com.squareup.retrofit2:converter-gson:2.3.0'
    //jsoup爬虫
    implementation 'org.jsoup:jsoup:1.18.2'

    //buttonLoading
    implementation 'br.com.simplepass:loading-button-android:2.2.0'
    //折叠布局
    implementation 'net.cachapa.expandablelayout:expandablelayout:2.9.2'

    //时间轴
    implementation 'com.github.alorma:timelineview:2.3.0'
    //圆形进度
    implementation 'com.github.lzyzsd:circleprogress:1.2.1'

    //多行collapsingToolbar
    implementation 'net.opacapp:multiline-collapsingtoolbar:27.1.1'

    implementation 'com.beloo.widget:ChipsLayoutManager:0.3.7@aar'//流式布局

    implementation 'com.cncoderx.wheelview:library:1.2.2'//滚轮选择器

    implementation 'com.github.ibrahimsn98:SmoothBottomBar:1.7.6'//底部导航



    //jetpack compose
    implementation "androidx.compose.ui:ui:$compose_version"
    // Tooling support (Previews, etc.)
    implementation "androidx.compose.ui:ui-tooling:$compose_version"
    // Foundation (Border, Background, Box, Image, Scroll, shapes, animations, etc.)
    implementation "androidx.compose.foundation:foundation:$compose_version"
    // Material Design
    implementation "androidx.compose.material:material:$compose_version"
    // Material design icons
    implementation "androidx.compose.material:material-icons-core:$compose_version"
    implementation "androidx.compose.material:material-icons-extended:$compose_version"
    // Integration with observables
    implementation "androidx.compose.runtime:runtime-livedata:$compose_version"
    implementation "androidx.compose.runtime:runtime-rxjava2:$compose_version"
    // UI Tests
    androidTestImplementation "androidx.compose.ui:ui-test-junit4:$compose_version"

    //setContent被移除
    implementation 'androidx.activity:activity-compose:1.9.1'

    implementation 'org.mnode.ical4j:ical4j:1.0.2'

    //爆炸效果
    implementation 'tyrantgit:explosionfield:1.0.1'

    // WorkManager for periodic course-snatching
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    implementation 'io.noties.markwon:core:4.6.2'
    implementation 'io.noties.markwon:linkify:4.6.2'
    implementation 'io.noties.markwon:ext-tables:4.6.2'
    implementation 'io.noties.markwon:ext-tasklist:4.6.2'
    implementation 'io.noties.markwon:ext-strikethrough:4.6.2'
    implementation 'io.noties.markwon:ext-latex:4.6.2'
    implementation 'io.noties.markwon:image-glide:4.6.2'
    implementation 'io.noties.markwon:html:4.6.2'
    // syntax highlight removed (prism4j artifacts not available in current mirrors)
    implementation 'ru.noties:jlatexmath-android:0.2.0'
}

// Compatibility alias for tooling/scripts that still invoke :app:testClasses (Java plugin task).
tasks.register('testClasses') {
    group = 'verification'
    description = 'Compatibility task alias for legacy invocations; runs debug unit tests.'
    dependsOn 'testDebugUnitTest'
}
