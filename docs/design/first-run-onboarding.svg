<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" font-family="sans-serif">
  <rect width="900" height="720" fill="#f6f7fb"/>
  <!-- intro phone -->
  <rect x="50" y="40" width="360" height="640" rx="36" fill="#ffffff" stroke="#dfe3ef"/>
  <text x="82" y="92" font-size="13" fill="#7b8194">1 / 2</text>
  <rect x="82" y="120" width="296" height="170" rx="28" fill="#eef2ff"/>
