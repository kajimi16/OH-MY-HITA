  <rect x="102" y="150" width="42" height="42" rx="12" fill="#ffffff" stroke="#c9d4ff"/>
  <rect x="316" y="150" width="42" height="42" rx="12" fill="#ffffff" stroke="#c9d4ff"/>
  <rect x="102" y="248" width="42" height="42" rx="12" fill="#ffffff" stroke="#c9d4ff"/>
  <rect x="316" y="248" width="42" height="42" rx="12" fill="#ffffff" stroke="#c9d4ff"/>
  <text x="82" y="356" font-size="34" font-weight="700" fill="#171a24">万物皆插件</text>
  <text x="82" y="388" font-size="15" fill="#5c6275">微内核 + 插件市场。课表、教务、</text>
  <text x="82" y="410" font-size="15" fill="#5c6275">界面和服务都能按需替换。</text>
  <g font-size="14" fill="#2a2f3f">
    <rect x="82" y="446" width="296" height="44" rx="12" fill="#f5f6fa"/>
    <text x="98" y="473">◇  微内核</text>
    <rect x="82" y="500" width="296" height="44" rx="12" fill="#f5f6fa"/>
    <text x="98" y="527">◇  按需组合</text>
    <rect x="82" y="554" width="296" height="44" rx="12" fill="#f5f6fa"/>
    <text x="98" y="581">◇  随时切换</text>
  </g>
  <rect x="82" y="616" width="296" height="50" rx="16" fill="#4f6ef7"/>
  <text x="230" y="648" font-size="16" font-weight="600" text-anchor="middle" fill="#ffffff">选择整合包</text>
  <text x="230" y="690" font-size="13" text-anchor="middle" fill="#7b8194">从零开始 · 之后可在插件市场切换</text>

  <!-- preset phone -->
  <rect x="490" y="40" width="360" height="640" rx="36" fill="#ffffff" stroke="#dfe3ef"/>
  <text x="522" y="86" font-size="20" fill="#171a24">←</text>
  <text x="556" y="86" font-size="13" fill="#7b8194">2 / 2</text>
  <text x="522" y="126" font-size="28" font-weight="700" fill="#171a24">选择你的起点</text>
  <text x="522" y="152" font-size="13" fill="#5c6275">整合包只是插件组合，之后随时可换</text>
  <g>
    <rect x="522" y="176" width="296" height="100" rx="18" fill="#f8f9fd" stroke="#4f6ef7" stroke-width="2"/>
    <rect x="538" y="194" width="46" height="46" rx="14" fill="#4f6ef7"/>
    <text x="561" y="223" font-size="18" text-anchor="middle" fill="#ffffff">H</text>
    <text x="598" y="210" font-size="15" font-weight="600" fill="#171a24">HITA-L v1.5.3</text>
    <text x="598" y="232" font-size="11" fill="#7b8194">经典轻量组合 · 10 个插件</text>
    <text x="598" y="254" font-size="11" fill="#5c6275">课表、教务、资源、个人主页</text>
    <text x="790" y="206" font-size="11" text-anchor="end" fill="#4f6ef7">推荐</text>
  </g>
  <g>
    <rect x="522" y="292" width="296" height="92" rx="18" fill="#fbfbfd" stroke="#e3e6f0"/>
    <rect x="538" y="310" width="46" height="46" rx="14" fill="#df7fa5"/>
    <text x="561" y="339" font-size="18" text-anchor="middle" fill="#ffffff">H</text>
    <text x="598" y="326" font-size="15" font-weight="600" fill="#171a24">HITA CUTE v1.6.0</text>
    <text x="598" y="348" font-size="11" fill="#7b8194">HITA_L 可爱分支 · 10 个插件</text>
    <text x="598" y="368" font-size="11" fill="#5c6275">20 套主题与课表配色</text>
  </g>
  <g>
    <rect x="522" y="400" width="296" height="92" rx="18" fill="#fbfbfd" stroke="#e3e6f0"/>
    <rect x="538" y="418" width="46" height="46" rx="14" fill="#e08a4f"/>
    <text x="561" y="447" font-size="18" text-anchor="middle" fill="#ffffff">H</text>
    <text x="598" y="434" font-size="15" font-weight="600" fill="#171a24">HITA Android 3.1.2</text>
    <text x="598" y="456" font-size="11" fill="#7b8194">完整组合 · 25 个插件</text>
  </g>
  <g>
    <rect x="522" y="508" width="296" height="92" rx="18" fill="#fbfbfd" stroke="#e3e6f0"/>
    <rect x="538" y="526" width="46" height="46" rx="14" fill="#3fa58f"/>
    <text x="561" y="555" font-size="18" text-anchor="middle" fill="#ffffff">H</text>
    <text x="598" y="542" font-size="15" font-weight="600" fill="#171a24">HITA-Lite 2.0</text>
    <text x="598" y="564" font-size="11" fill="#7b8194">旧版三页界面 · 3 个插件</text>
    <text x="790" y="542" font-size="10" text-anchor="end" fill="#3fa58f">使用中</text>
  </g>
  <rect x="522" y="624" width="296" height="48" rx="16" fill="#4f6ef7"/>
  <text x="670" y="654" font-size="16" font-weight="600" text-anchor="middle" fill="#ffffff">应用并开始</text>
