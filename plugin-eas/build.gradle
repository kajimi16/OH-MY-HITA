plugins {
    id 'com.android.library'
    id 'kotlin-android'
}

android {
    defaultConfig {
        minSdkVersion 23
        targetSdk 33
        compileSdk 35
    }
    buildFeatures { viewBinding = true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }
    namespace 'com.stupidtree.hita.eas'
}

dependencies {
    api project(':api')
    api project(':model')
    implementation project(':component')
    implementation project(':style')
    implementation project(':user')
    implementation project(':sync')

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'br.com.simplepass:loading-button-android:2.2.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    implementation 'com.squareup.retrofit2:converter-gson:2.3.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'org.jsoup:jsoup:1.18.2'
}
dependencies { testImplementation 'junit:junit:4.13.2' }

// 运行时插件产物：仅打包插件自身类，宿主提供 API/Compose/AndroidX 等依赖。
// 不能使用 assembleRelease AAR：运行时不携带资源，登录等 UI 必须放宿主 T3。
def sdkDirForDex = {
    def props = new Properties()
    def f = rootProject.file('local.properties')
    if (f.exists()) f.withInputStream { props.load(it) }
    props.getProperty('sdk.dir') ?: System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT')
}

tasks.register('pluginClassesJar', Jar) {
    dependsOn 'compileDebugKotlin'
    from layout.buildDirectory.dir('tmp/kotlin-classes/debug')
    archiveFileName = 'plugin-classes.jar'
    destinationDirectory = layout.buildDirectory.dir('runtime-dex')
}

tasks.register('buildRuntimeDex') {
    dependsOn 'pluginClassesJar'
    doLast {
        def sdk = sdkDirForDex()
        if (!sdk) throw new GradleException('找不到 Android SDK')
        def outDir = layout.buildDirectory.dir('runtime-dex').get().asFile
        def d8 = new File(sdk, 'build-tools/35.0.0/d8')
        def androidJar = new File(sdk, 'platforms/android-35/android.jar')
        def rJar = layout.buildDirectory.file(
            'intermediates/compile_r_class_jar/debug/generateDebugRFile/R.jar'
        ).get().asFile
        def classesJar = new File(outDir, 'plugin-classes.jar')
        def dexDir = new File(outDir, 'classes')
        dexDir.deleteDir()
        dexDir.mkdirs()
        exec {
            commandLine d8, '--lib', androidJar, '--min-api', '23',
                '--output', dexDir, classesJar, rJar
        }
        def dex = new File(dexDir, 'classes.dex')
        if (!dex.exists()) throw new GradleException('plugin dex 未生成')
        new File(outDir, 'plugin.dex').bytes = dex.bytes
        println "plugin dex: ${new File(outDir, 'plugin.dex').absolutePath}"
    }
}
