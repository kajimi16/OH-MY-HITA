plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.stupidtree.hita.ui.ai'
    defaultConfig {
        applicationId "com.stupidtree.hita.ui.ai"
        minSdkVersion 23
        targetSdk 33
        compileSdk 35
        versionCode 1
        versionName "0.4.1"
    }
    buildFeatures { compose = true }
    composeOptions { kotlinCompilerExtensionVersion '1.5.8' }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }
}

dependencies {
    compileOnly project(':api')
    compileOnly "androidx.compose.runtime:runtime:1.6.8"
    compileOnly "androidx.compose.ui:ui:1.6.8"
    compileOnly "androidx.compose.foundation:foundation:1.6.8"
    compileOnly "androidx.compose.material:material:1.6.8"
    compileOnly "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3"
    compileOnly "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    compileOnly "com.google.code.gson:gson:2.8.9"
}
