plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.stupidtree.hita.ui.compare'
    defaultConfig {
        applicationId "com.stupidtree.hita.ui.compare"
        minSdkVersion 23
        targetSdk 33
        compileSdk 35
        versionCode 1
        versionName "0.1.0"
    }
    buildFeatures { compose = true }
    composeOptions { kotlinCompilerExtensionVersion '1.5.8' }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }
}

dependencies {
    compileOnly project(':api')
    compileOnly "androidx.compose.runtime:runtime:1.6.8"
    compileOnly "androidx.compose.runtime:runtime-livedata:1.6.8"
    compileOnly "androidx.compose.ui:ui:1.6.8"
    compileOnly "androidx.compose.foundation:foundation:1.6.8"
    compileOnly "androidx.compose.material:material:1.6.8"
}
