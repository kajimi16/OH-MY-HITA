plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.stupidtree.hita.ui.live'
    defaultConfig {
        applicationId "com.stupidtree.hita.ui.live"
        minSdkVersion 23
        targetSdk 33
        compileSdk 36
        versionCode 1
        versionName "0.2.0"
    }
    buildFeatures { compose = true }
compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = "1.8" }
}

dependencies {
    compileOnly project(':api')
    compileOnly "androidx.compose.runtime:runtime:1.9.4"
    compileOnly "androidx.compose.ui:ui:1.9.4"
    compileOnly "androidx.compose.foundation:foundation:1.9.4"
    compileOnly "androidx.compose.material:material:1.9.4"
}
