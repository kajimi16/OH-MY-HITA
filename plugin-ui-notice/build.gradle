plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.stupidtree.hita.ui.notice'
    defaultConfig {
        applicationId "com.stupidtree.hita.ui.notice"
        minSdkVersion 23
        targetSdk 33
        compileSdk 35
        versionCode 1
        versionName "0.1.1"
    }
    buildFeatures { compose = true }
    composeOptions { kotlinCompilerExtensionVersion '1.5.8' }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = "1.8" }
}

dependencies {
    compileOnly project(':api')
    compileOnly "androidx.compose.runtime:runtime:1.6.8"
    compileOnly "androidx.compose.ui:ui:1.6.8"
    compileOnly "androidx.compose.foundation:foundation:1.6.8"
    compileOnly "androidx.compose.material:material:1.6.8"
    compileOnly "org.jsoup:jsoup:1.18.2"
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation "androidx.compose.runtime:runtime:1.6.8"
    testImplementation 'org.jsoup:jsoup:1.18.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'org.jetbrains.kotlin:kotlin-test:1.9.22'
}
