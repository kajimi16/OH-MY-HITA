plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.stupidtree.hita.ui.resource'
    defaultConfig {
        applicationId "com.stupidtree.hita.ui.resource"
        minSdkVersion 23
        targetSdk 33
        compileSdk 35
        versionCode 1
        versionName "0.4.8"
    }
    buildFeatures {
        compose = true
        buildConfig = true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.8'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }
}

// 宿主提供 api / Compose / Markwon 运行时；插件只编译，不打包。
dependencies {
    compileOnly project(':api')
    compileOnly "androidx.compose.runtime:runtime:1.6.8"
    compileOnly "androidx.compose.runtime:runtime-livedata:1.6.8"
    compileOnly "androidx.compose.ui:ui:1.6.8"
    compileOnly "androidx.compose.foundation:foundation:1.6.8"
    compileOnly "androidx.compose.material:material:1.6.8"
    compileOnly "androidx.activity:activity-compose:1.9.1"
    compileOnly "androidx.lifecycle:lifecycle-livedata-core:2.8.4"
    compileOnly 'io.noties.markwon:core:4.6.2'
    compileOnly 'io.noties.markwon:html:4.6.2'
    compileOnly 'io.noties.markwon:linkify:4.6.2'
    compileOnly 'io.noties.markwon:ext-tables:4.6.2'
    compileOnly 'io.noties.markwon:ext-strikethrough:4.6.2'
    compileOnly 'io.noties.markwon:ext-tasklist:4.6.2'
    compileOnly 'io.noties.markwon:ext-latex:4.6.2'
    compileOnly 'io.noties.markwon:image-glide:4.6.2'
    compileOnly 'ru.noties:jlatexmath-android:0.2.0'
    compileOnly 'com.github.bumptech.glide:glide:4.16.0'
    compileOnly "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
}
