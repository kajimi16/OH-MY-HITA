plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.example.hitaui.sample'
    defaultConfig {
        applicationId "com.example.hitaui.sample"
        minSdkVersion 23
        targetSdk 33
        compileSdk 36
        versionCode 1
        versionName "0.3.1"
    }
    buildFeatures {
        compose = true
        buildConfig = true
    }
compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }
}

// 运行时界面插件：不依赖宿主任何实现，compose 全部 compileOnly（宿主提供运行时）。
dependencies {
    compileOnly project(':api')
    compileOnly "androidx.compose.runtime:runtime:1.9.4"
    compileOnly "androidx.compose.ui:ui:1.9.4"
    compileOnly "androidx.compose.foundation:foundation:1.9.4"
    compileOnly "androidx.compose.material:material:1.9.4"
    compileOnly "androidx.compose.runtime:runtime-livedata:1.9.4"
    compileOnly "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3"
    compileOnly "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
}
